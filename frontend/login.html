<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniRAG — Sign in</title>
  <link rel="icon" href="/static/images/omnirag-favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body>

<div class="login-page">
  <div class="login-mosaic" id="loginMosaic"></div>
  <div class="login-overlay"></div>

  <div class="login-content">
    <div class="login-brand">
      <svg class="login-brand-icon" width="70" height="70" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <rect x="12" y="8" width="30" height="38" rx="4" stroke="currentColor" stroke-width="2" opacity="0.42"/>
        <rect x="17" y="13" width="30" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="23" y1="24" x2="41" y2="24" stroke="currentColor" stroke-width="1.8"/>
        <line x1="23" y1="32" x2="41" y2="32" stroke="currentColor" stroke-width="1.8"/>
        <line x1="23" y1="40" x2="35" y2="40" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span class="login-brand-word">Omni<span>RAG</span></span>
    </div>

    <p class="login-tagline">Every document you own, instantly understood.</p>

    <div class="login-panel">
      <div id="googleSignIn" class="login-google-signin" aria-label="Continue with Google"></div>
      <p id="loginError" class="login-error" role="alert" hidden></p>
      <p class="login-panel-note">We use your Google account to keep your workspace<br>and documents in sync across devices.</p>
    </div>

  </div>
</div>

<script src="/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/static/js/login.js"></script>
</body>
</html>
